<head>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;

            height: 100vh;

        /* --- Fondo de Espacio Animado --- */
body {
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  overflow-x: hidden;
  margin: 0;
}

#stars, #stars2, #stars3 {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  background: transparent;
  z-index: -1;
}
/* --- Posición de las Estrellas (Los puntitos) --- */
#stars {
  box-shadow: 446px 61px #FFF, 241px 813px #FFF, 1500px 300px #FFF, 1200px 800px #FFF, 100px 500px #FFF, 900px 100px #FFF, 1800px 400px #FFF;
  animation: animStar 50s linear infinite;
}

#stars2 {
  width: 2px;
  height: 2px;
  box-shadow: 100px 200px #FFF, 400px 500px #FFF, 800px 100px #FFF, 1200px 600px #FFF, 1500px 900px #FFF;
  animation: animStar 100s linear infinite;
}

#stars3 {
  width: 3px;
  height: 3px;
  box-shadow: 300px 400px #FFF, 700px 100px #FFF, 1100px 800px #FFF;
  animation: animStar 150s linear infinite;
}

/* --- Animación del Movimiento --- */
@keyframes animStar {
  from { transform: translateY(0px); }
  to { transform: translateY(-2000px); }
}

/* Capa 1: Estrellas pequeñas (muchas) */
#stars {width: 1px;
  height: 1px;

}

}
  width: 1px;

/* Capa 2: Estrellas medianas */
#stars2 {
  width: 2px;

  animation: animStar 100s linear infinite;
}

/* Capa 3: Estrellas grandes y brillantes */

  width: 3px;
